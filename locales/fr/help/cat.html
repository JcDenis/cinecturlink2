  <title>Catégorie</title>
</head>

<body>
  <p>Une catégorie a besoin d'un titre et d'une description, de 64 caractères au plus. Deux catégories ne peuvent pas avoir le même titre.</p>
  <p>Sur une catégorie existante, un message indique combien de liens l'utilisent. Supprimer la catégorie conserve ces liens, sans catégorie.</p>
</body>
